[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-center-mcp"
version = "0.1.0"
description = "Standalone MCP server for Cisco Catalyst Center auto-generated tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "jsonpatch>=1.33",
    "jsonpointer>=3.0.0",
    "packaging>=24.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["catalyst_center_mcp*"]

[tool.setuptools.package-data]
catalyst_center_mcp = [
    "bundled_tools/.gitkeep",
    "bundled_tools/manifest.json",
    "bundled_tools/Agent_DNAC/autogen/promoted/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
